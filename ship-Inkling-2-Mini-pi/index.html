<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon — A Relaxing Ship Simulator</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #06121f; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hud {
    position: fixed; top: 24px; left: 28px; z-index: 10; pointer-events: none;
    color: #fff; font-family: "Georgia", serif; text-shadow: 0 2px 14px rgba(0,0,0,.55);
  }
  .hud h1 { font-size: 30px; font-weight: 400; letter-spacing: .35em; text-transform: uppercase; }
  .hud p { margin-top: 6px; font-size: 13px; letter-spacing: .12em; opacity: .8; font-family: Verdana, sans-serif; }
  #phase {
    position: fixed; top: 26px; right: 30px; z-index: 10; pointer-events: none;
    display:flex; align-items:center; gap:10px; color:#fff;
    font-family: Verdana, sans-serif; font-size: 12px; letter-spacing:.18em; text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  #phase .dot { width: 12px; height: 12px; border-radius: 50%; background: #ffd98a; box-shadow: 0 0 14px 3px rgba(255,217,138,.8); transition: all 1s ease; }
  #hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none;
    color: rgba(255,255,255,.85); font-family: Verdana, sans-serif; font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(8,18,32,.35); backdrop-filter: blur(6px);
    animation: breathe 3.4s ease-in-out infinite;
    transition: opacity 1s ease;
  }
  @keyframes breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud"><h1>Horizon</h1><p>a quiet sail</p></div>
<div id="phase"><span class="dot" id="phaseDot"></span><span id="phaseLabel">Day</span></div>
<div id="hint">drag to look around · scroll to zoom · click the sea</div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
