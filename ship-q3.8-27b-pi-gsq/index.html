<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Adrift — a relaxing ship simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🚢</text></svg>"/>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1020; }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }
  .ui {
    position: fixed; left: 0; right: 0; pointer-events: none;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    user-select: none; z-index: 10;
  }
  #title { top: 18px; left: 26px; font-size: 30px; letter-spacing: 4px; font-weight: 400; }
  #clock { top: 58px; left: 26px; font-size: 14px; letter-spacing: 2px; font-family: ui-monospace, monospace; opacity: 0.85; }
  #hint {
    bottom: 22px; left: 0; right: 0; text-align: center;
    font-size: 13px; letter-spacing: 1px; opacity: 0.65;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 62%, rgba(4, 8, 20, 0.38) 100%);
  }
</style>
<script>
  // Debug hook: capture console errors + unhandled rejections for inspection.
  window.__capturedErrors = [];
  const __origErr = console.error.bind(console);
  console.error = (...a) => { __origErr(...a); window.__capturedErrors.push(a.map(x => (x instanceof Error ? x.stack : String(x))).join(' ')); };
  window.addEventListener('error', e => window.__capturedErrors.push('window error: ' + e.message));
  window.addEventListener('unhandledrejection', e => window.__capturedErrors.push('unhandled rejection: ' + (e.reason && e.reason.stack || e.reason)));
</script>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div class="ui" id="title">A D R I F T</div>
<div class="ui" id="clock"></div>
<div class="ui" id="hint">drag to look around &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; click the sea to make a wave</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
