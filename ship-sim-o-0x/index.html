<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Adrift — a quiet sea</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04070d; }
  canvas { display: block; touch-action: none; }

  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    font-family: Georgia, "Times New Roman", serif;
    color: rgba(255, 255, 255, 0.92);
    z-index: 10;
  }

  #title {
    position: absolute;
    top: 28px;
    left: 34px;
    letter-spacing: 0.42em;
    font-size: 20px;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
    user-select: none;
  }
  #title small {
    display: block;
    margin-top: 7px;
    letter-spacing: 0.18em;
    font-style: italic;
    font-size: 11px;
    opacity: 0.62;
  }

  #hint {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12.5px;
    font-style: italic;
    letter-spacing: 0.12em;
    opacity: 0.75;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
    user-select: none;
    animation: hintFade 3s ease 9s forwards;
    white-space: nowrap;
  }
  @keyframes hintFade { to { opacity: 0.28; } }

  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background:
      radial-gradient(ellipse at center,
        rgba(0,0,0,0)   58%,
        rgba(0,0,0,0.22) 100%);
  }

  #fallback {
    display: none;
    position: fixed;
    inset: 0;
    place-items: center;
    color: #cfd8e3;
    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 0.08em;
    z-index: 20;
    text-align: center;
    padding: 24px;
  }
</style>
</head>
<body>
<div id="ui">
  <div id="title">ADRIFT<small>a quiet sea</small></div>
  <div id="hint">drag to look around &mdash; click the water</div>
</div>
<div id="vignette"></div>
<div id="fallback">This experience needs WebGL.<br />Please try a recent desktop or mobile browser.</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
