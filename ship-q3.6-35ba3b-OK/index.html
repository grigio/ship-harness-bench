<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Ship Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; }
  #info {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
    padding: 8px 20px; border-radius: 20px; font-size: 13px;
    pointer-events: none; user-select: none; letter-spacing: 0.3px;
  }
  #time-display {
    position: fixed; top: 16px; right: 16px;
    color: #fff; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
    padding: 8px 16px; border-radius: 12px; font-size: 13px;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="info">Click on the sea to create waves · Drag to orbit · Scroll to zoom</div>
<div id="time-display">☀️ Day</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Globals ────────────────────────────────────────────────
let scene, camera, renderer, controls;
let ship, ocean, sky;
let waves = [];
const clock = new THREE.Clock();
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Day/night cycle
let sunAngle = 0;
const SUN_SPEED = 0.04;

// ─── Init ───────────────────────────────────────────────────
function init() {
  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  // Scene
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x87CEEB, 0.0015);

  // Camera
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 2000);
  camera.position.set(25, 15, 35);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.minDistance = 10;
  controls.maxDistance = 120;
  controls.target.set(0, 0, 0);

  createSky();
  createOcean();
  createShip();
  createLighting();
  createClouds();

  // Events
  renderer.domElement.addEventListener('click', onClick);
  window.addEventListener('resize', onResize);

  animate();
}

// ─── Sky Dome with Day/Night ───────────────────────────────
function createSky() {
  const skyGeo = new THREE.SphereGeometry(900, 32, 32);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      uSunAngle: { value: 0 },
      uTopColorDay: { value: new THREE.Color(0x0077ff) },
      uBottomColorDay: { value: new THREE.Color(0xaaddff) },
      uTopColorNight: { value: new THREE.Color(0x000011) },
      uBottomColorNight: { value: new THREE.Color(0x0a0a2a) },
      uSunriseColor1: { value: new THREE.Color(0xff4400) },
      uSunriseColor2: { value: new THREE.Color(0xffaa44) },
      uSunriseColor3: { value: new THREE.Color(0x4488ff) },
      uSunColor: { value: new THREE.Color(0xffffee) }
    },
    vertexShader: `
      varying vec3 vWorldPosition;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uSunAngle;
      uniform vec3 uTopColorDay, uBottomColorDay;
      uniform vec3 uTopColorNight, uBottomColorNight;
      uniform vec3 uSunriseColor1, uSunriseColor2, uSunriseColor3;
      uniform vec3 uSunColor;
      varying vec3 vWorldPosition;

      void main() {
        float height = normalize(vWorldPosition).y;
        float sunY = sin(uSunAngle);
        float sunX = cos(uSunAngle);

        // Day/night blend
        float dayFactor = smoothstep(-0.2, 0.3, sunY);
        float sunsetFactor = smoothstep(0.0, 0.25, sunY) * smoothstep(0.5, 0.15, sunY);

        vec3 dayColor = mix(uBottomColorDay, uTopColorDay, max(height, 0.0));
        vec3 nightColor = mix(uBottomColorNight, uTopColorNight, max(height, 0.0));
        vec3 skyColor = mix(nightColor, dayColor, dayFactor);

        // Sunset colors near horizon
        float horizonBlend = exp(-abs(height - 0.02) * 8.0);
        if (sunsetFactor > 0.1) {
          vec3 sunset = mix(uSunriseColor1, uSunriseColor2, smoothstep(0.0, 0.15, sunY));
          sunset = mix(sunset, uSunriseColor3, smoothstep(0.25, 0.4, sunY));
          skyColor = mix(skyColor, sunset, horizonBlend * sunsetFactor);
        }

        // Sun disc
        vec3 sunDir = normalize(vec3(sunX, sunY, 0.0));
        vec3 viewDir = normalize(vWorldPosition);
        float sunDot = max(dot(viewDir, sunDir), 0.0);
        float sunDisc = smoothstep(0.998, 0.9995, sunDot);
        float sunGlow = pow(sunDot, 8.0) * 0.3 * smoothstep(-0.1, 0.3, sunY);
        skyColor += uSunColor * (sunDisc + sunGlow) * smoothstep(-0.1, 0.1, sunY);

        // Stars at night
        float nightFactor = 1.0 - dayFactor;
        if (nightFactor > 0.5 && height > 0.0) {
          float star = fract(sin(dot(floor(vWorldPosition.xz * 0.5), vec2(12.9898, 78.233))) * 43758.5453);
          nightFactor *= smoothstep(0.0, 0.3, height);
          skyColor += vec3(star > 0.997 ? 1.0 : 0.0) * nightFactor * 0.8;
        }

        gl_FragColor = vec4(skyColor, 1.0);
      }
    `
  });

  sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);
}

// ─── Ocean with Animated Waves ─────────────────────────────
function createOcean() {
  const size = 600;
  const segments = 256;
  const oceanGeo = new THREE.PlaneGeometry(size, size, segments, segments);
  oceanGeo.rotateX(-Math.PI / 2);

  const oceanMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uSunAngle: { value: 0 },
      uWaterColor: { value: new THREE.Color(0x006994) },
      uDeepColor: { value: new THREE.Color(0x001833) },
      uSunColor: { value: new THREE.Color(0xffffee) },
      uFogColor: { value: scene.fog.color }
    },
    vertexShader: `
      uniform float uTime;
      varying vec3 vWorldPos;
      varying vec3 vNormal;
      varying vec2 vUv;

      // Wave function
      float wave(vec2 pos, float time) {
        float h = 0.0;
        // Primary swell
        h += sin(pos.x * 0.05 + time * 0.8) * 0.8;
        h += sin(pos.y * 0.07 + time * 0.6) * 0.6;
        // Secondary chop
        h += sin(pos.x * 0.15 + pos.y * 0.1 + time * 1.2) * 0.25;
        h += sin(pos.x * 0.2 - pos.y * 0.15 + time * 0.9) * 0.15;
        // Small ripples
        h += sin(pos.x * 0.5 + time * 2.0) * 0.05;
        h += sin(pos.y * 0.4 + time * 1.8) * 0.04;
        return h;
      }

      void main() {
        vUv = uv;
        vec3 pos = position;

        // Apply wave displacement
        float h = wave(pos.xz, uTime);
        pos.y += h;

        // Compute normal via neighbors
        float eps = 0.5;
        float hx = wave(pos.xz + vec2(eps, 0.0), uTime) - h;
        float hy = wave(pos.xz + vec2(0.0, eps), uTime) - h;
        vNormal = normalize(vec3(-hx / eps, 1.0, -hy / eps));

        vWorldPos = (modelMatrix * vec4(pos, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uSunAngle;
      uniform vec3 uWaterColor, uDeepColor, uSunColor, uFogColor;
      varying vec3 vWorldPos;
      varying vec3 vNormal;
      varying vec2 vUv;

      void main() {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);
        vec3 L = normalize(vec3(cos(uSunAngle), sin(uSunAngle), 0.5));

        // Fresnel
        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        vec3 waterCol = mix(uDeepColor, uWaterColor, 0.5 + 0.5 * N.y);

        // Diffuse
        float diff = max(dot(N, L), 0.0) * 0.3;

        // Specular sun reflection
        vec3 H = normalize(L + V);
        float spec = pow(max(dot(N, H), 0.0), 128.0);
        vec3 specular = uSunColor * spec * 1.5;

        // Sky reflection hint
        float skyFactor = smoothstep(-0.1, 0.5, N.y);
        vec3 skyRefl = mix(vec3(0.1, 0.2, 0.4), vec3(0.3, 0.6, 0.9), skyFactor);

        // Combine
        vec3 col = mix(waterCol + diff, skyRefl, fresnel * 0.6);
        col += specular;

        // Foam on wave peaks
        float foam = smoothstep(1.0, 1.5, sin(vWorldPos.x * 0.1 + uTime) *
                                     sin(vWorldPos.z * 0.1 + uTime * 0.7));
        col = mix(col, vec3(0.85, 0.9, 0.95), foam * 0.15);

        // Fog
        float dist = length(vWorldPos - cameraPosition);
        float fogFactor = 1.0 - exp(-dist * 0.0015);
        col = mix(col, uFogColor, fogFactor);

        gl_FragColor = vec4(col, 0.95);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide
  });

  ocean = new THREE.Mesh(oceanGeo, oceanMat);
  scene.add(ocean);
}

// ─── Ship ───────────────────────────────────────────────────
function createShip() {
  ship = new THREE.Group();

  // Hull
  const hullShape = new THREE.Shape();
  hullShape.moveTo(0, -1.5);
  hullShape.bezierCurveTo(3, -1.5, 6, -1.0, 8, -0.5);
  hullShape.bezierCurveTo(9, 0, 9, 0.5, 8, 1.0);
  hullShape.lineTo(7, 1.0);
  hullShape.lineTo(7, -1.0);
  hullShape.lineTo(1, -1.0);
  hullShape.bezierCurveTo(0, -1.0, -0.5, -1.5, 0, -1.5);

  const hullExtrudeSettings = { depth: 2.5, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 2 };
  const hullGeo = new THREE.ExtrudeGeometry(hullShape, hullExtrudeSettings);
  const hullMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.8 });
  const hull = new THREE.Mesh(hullGeo, hullMat);
  hull.rotation.x = -Math.PI / 2;
  hull.position.set(4, -0.3, 1.25);
  ship.add(hull);

  // Hull bottom (dark)
  const bottomGeo = new THREE.BoxGeometry(7, 0.3, 2.2);
  const bottomMat = new THREE.MeshStandardMaterial({ color: 0x331111, roughness: 0.9 });
  const bottom = new THREE.Mesh(bottomGeo, bottomMat);
  bottom.position.set(4, -1.1, 0);
  ship.add(bottom);

  // Cabin
  const cabinGeo = new THREE.BoxGeometry(2, 1.5, 2);
  const cabinMat = new THREE.MeshStandardMaterial({ color: 0xeeeedd, roughness: 0.6 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(3.5, 0.5, 0);
  ship.add(cabin);

  // Mast
  const mastGeo = new THREE.CylinderGeometry(0.06, 0.08, 8, 8);
  const mastMat = new THREE.MeshStandardMaterial({ color: 0x654321 });
  const mast = new THREE.Mesh(mastGeo, mastMat);
  mast.position.set(5.5, 3.5, 0);
  ship.add(mast);

  // Sail
  const sailGeo = new THREE.PlaneGeometry(3, 3.5);
  const sailMat = new THREE.MeshStandardMaterial({
    color: 0xf5f5dc, roughness: 0.9, side: THREE.DoubleSide
  });
  const sail = new THREE.Mesh(sailGeo, sailMat);
  sail.position.set(4.8, 4.5, 0);
  sail.rotation.z = 0.15;
  ship.add(sail);

  // Flag
  const flagGeo = new THREE.PlaneGeometry(0.8, 0.5);
  const flagMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, side: THREE.DoubleSide });
  const flag = new THREE.Mesh(flagGeo, flagMat);
  flag.position.set(6.0, 7.3, 0);
  ship.add(flag);

  // Bow decoration
  const bowGeo = new THREE.CylinderGeometry(0.04, 0.06, 3, 8);
  const bow = new THREE.Mesh(bowGeo, mastMat);
  bow.rotation.z = Math.PI / 2;
  bow.rotation.y = 0.3;
  bow.position.set(8.5, 0.5, 0);
  ship.add(bow);

  ship.position.y = 0.2;
  scene.add(ship);
}

// ─── Lighting ───────────────────────────────────────────────
let ambientLight, directionalLight, hemisphereLight;
function createLighting() {
  ambientLight = new THREE.AmbientLight(0x404060, 0.4);
  scene.add(ambientLight);

  hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x006994, 0.3);
  scene.add(hemisphereLight);

  directionalLight = new THREE.DirectionalLight(0xffffee, 1.0);
  directionalLight.position.set(50, 50, 30);
  scene.add(directionalLight);
}

// ─── Clouds ─────────────────────────────────────────────────
let clouds = [];
function createClouds() {
  const cloudMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.6,
    roughness: 1
  });

  for (let i = 0; i < 20; i++) {
    const cloud = new THREE.Group();
    const count = 3 + Math.floor(Math.random() * 4);
    for (let j = 0; j < count; j++) {
      const size = 3 + Math.random() * 6;
      const geo = new THREE.SphereGeometry(size, 8, 6);
      const mesh = new THREE.Mesh(geo, cloudMat);
      mesh.position.set(j * 3 - count, Math.random() * 2, Math.random() * 2);
      mesh.scale.y = 0.4;
      cloud.add(mesh);
    }
    cloud.position.set(
      (Math.random() - 0.5) * 400,
      30 + Math.random() * 40,
      (Math.random() - 0.5) * 400
    );
    cloud.userData.speed = 0.5 + Math.random() * 1.5;
    scene.add(cloud);
    clouds.push(cloud);
  }
}

// ─── Click Wave ─────────────────────────────────────────────
function onClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(ocean);

  if (intersects.length > 0) {
    const point = intersects[0].point;
    createWaveRipple(point.x, point.z);
  }
}

function createWaveRipple(x, z) {
  const radius = 8;
  const height = 2.0;
  waves.push({
    x, z, radius, height, time: 0,
    duration: 4.0,
    geo: new THREE.RingGeometry(0.5, radius, 48, 4)
  });

  // Visual ripple ring
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.5,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(waves[waves.length - 1].geo, mat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, 0.3, z);
  scene.add(ring);
  waves[waves.length - 1].mesh = ring;
}

// ─── Resize ─────────────────────────────────────────────────
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ─── Animation Loop ─────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // Day/night cycle
  sunAngle += SUN_SPEED * dt;
  const sunY = Math.sin(sunAngle);
  const sunX = Math.cos(sunAngle);
  const dayFactor = smoothstep(-0.2, 0.3, sunY);

  // Update sky
  sky.material.uniforms.uSunAngle.value = sunAngle;

  // Update ocean
  ocean.material.uniforms.uTime.value = elapsed;
  ocean.material.uniforms.uSunAngle.value = sunAngle;

  // Sun color based on angle
  const sunColor = new THREE.Color();
  if (dayFactor > 0.5) {
    sunColor.setHex(0xffffee);
  } else if (dayFactor > 0.1) {
    sunColor.setHex(0xff8844);
  } else {
    sunColor.setHex(0xff4400);
  }
  ocean.material.uniforms.uSunColor.value.copy(sunColor);
  directionalLight.color.copy(sunColor);
  renderer.toneMappingExposure = 0.4 + dayFactor * 0.8;

  // Update time display
  const timeDisplay = document.getElementById('time-display');
  if (dayFactor > 0.5) {
    const hour = Math.floor(((sunAngle % (Math.PI * 2)) / (Math.PI * 2)) * 24) % 24;
    timeDisplay.textContent = `☀️ ${String(hour).padStart(2, '0')}:00`;
    timeDisplay.style.background = 'rgba(255,200,50,0.2)';
  } else if (dayFactor > 0.1) {
    timeDisplay.textContent = '🌅 Dawn/Dusk';
    timeDisplay.style.background = 'rgba(255,100,50,0.2)';
  } else {
    timeDisplay.textContent = '🌙 Night';
    timeDisplay.style.background = 'rgba(50,50,150,0.3)';
  }

  // Lighting updates
  ambientLight.intensity = 0.15 + dayFactor * 0.5;
  directionalLight.intensity = dayFactor;
  hemisphereLight.intensity = dayFactor * 0.5;

  // Sun direction
  directionalLight.position.set(sunX * 60, sunY * 60, 30);

  // Fog color
  const fogColor = new THREE.Color().lerpColors(
    new THREE.Color(0x050515),
    new THREE.Color(0x87CEEB),
    dayFactor
  );
  scene.fog.color.copy(fogColor);
  ocean.material.uniforms.uFogColor.value.copy(fogColor);

  // Ship animation (gentle bobbing and rocking)
  const shipBob = Math.sin(elapsed * 0.8) * 0.3 + Math.sin(elapsed * 1.3) * 0.15;
  const shipRock = Math.sin(elapsed * 0.6) * 0.05 + Math.sin(elapsed * 1.1) * 0.03;
  const shipPitch = Math.sin(elapsed * 0.7) * 0.03;
  ship.position.y = 0.2 + shipBob;
  ship.rotation.z = shipRock;
  ship.rotation.x = shipPitch;

  // Sail flutter
  if (ship.children[3]) {
    const sail = ship.children[3];
    sail.rotation.y = Math.sin(elapsed * 1.2) * 0.1;
  }

  // Cloud drift
  for (const cloud of clouds) {
    cloud.position.x += cloud.userData.speed * dt;
    if (cloud.position.x > 250) cloud.position.x = -250;
  }

  // Update waves
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.time += dt;
    const progress = w.time / w.duration;

    if (progress >= 1.0) {
      scene.remove(w.mesh);
      w.geo.dispose();
      w.mesh.material.dispose();
      waves.splice(i, 1);
      continue;
    }

    const expandedRadius = w.radius * (0.5 + progress * 1.5);
    w.mesh.scale.set(expandedRadius / 8, expandedRadius / 8, 1);
    w.mesh.material.opacity = 0.5 * (1 - progress);
    w.mesh.position.y = 0.3 + Math.sin(progress * Math.PI) * 0.5;
  }

  controls.update();
  renderer.render(scene, camera);
}

// ─── Helpers ────────────────────────────────────────────────
function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

// ─── Start ──────────────────────────────────────────────────
init();
</script>
</body>
</html>
