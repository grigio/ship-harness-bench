<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Sea · a relaxing ship simulator</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    background: #04050d;
    font-family: "Georgia", "Times New Roman", serif;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  #clock {
    position: fixed;
    top: 18px; left: 22px;
    color: rgba(255,255,255,0.82);
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: lowercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.45);
    pointer-events: none;
    user-select: none;
  }

  #hint {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    letter-spacing: 0.8px;
    white-space: nowrap;
    text-shadow: 0 1px 10px rgba(0,0,0,0.5);
    pointer-events: none;
    user-select: none;
  }

  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 58%,
                rgba(6,10,24,0.08) 84%,
                rgba(4,6,14,0.26) 100%);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="diag" style="display:none">init</div>
<script type="module">
/*__BUNDLE__*/
</script>
</body>
</html>
